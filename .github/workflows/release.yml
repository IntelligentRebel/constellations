# Publishes a GitHub release for each version: when package.json (the version) or docs/releases/ changes on main,
# and that version has no release yet, it creates the release v<version> with the game itself (index.html, the whole
# game in one file: the local copies offer it when they find a newer version) and a zip of the repository. Its notes
# are docs/releases/<version>.md (English), followed by docs/releases/<version>.fr.md in a « En français » block when
# there is one (the game shows the French part to French players).
name: Release
on:
  push:
    branches: [main]
    paths: [package.json, 'docs/releases/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" > /dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - name: Zip and release
        if: steps.check.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          zip -qr "Constellations_v$V.zip" . -x '.git/*' '.github/*' 'node_modules/*' 'dist/*'
          mkdir -p /tmp/game && cp index.html /tmp/game/index.html
          if [ -f "docs/releases/$V.md" ]; then cp "docs/releases/$V.md" /tmp/notes.md; else echo "The history of versions is in README.fr.md (in French)." > /tmp/notes.md; fi
          if [ -f "docs/releases/$V.fr.md" ]; then
            printf '\n\n<details><summary>En français</summary>\n\n' >> /tmp/notes.md
            cat "docs/releases/$V.fr.md" >> /tmp/notes.md
            printf '\n\n</details>\n' >> /tmp/notes.md
          fi
          gh release create "v$V" "/tmp/game/index.html" "Constellations_v$V.zip" --title "Constellations $V" --notes-file /tmp/notes.md --target "$GITHUB_SHA" --latest
